name: Bug Report
description: Something in the application doesn't work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Please do not include real financial data, real plan exports, or real account balances.** Use anonymized or example figures.
  - type: input
    id: app-version
    attributes:
      label: App version / build
      description: Shown in the app, or in NOTICE.md for the release you downloaded (e.g. 3.0.0 / FDS-DEFINITIVE-20260826).
      placeholder: "3.0.0 / FDS-DEFINITIVE-20260826"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 128 on macOS 14"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / macOS 14 / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use example/anonymized data, step by step.
      placeholder: |
        1. Open the app
        2. Go to ...
        3. Enter ...
        4. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, console errors, etc. Redact any personal data.
