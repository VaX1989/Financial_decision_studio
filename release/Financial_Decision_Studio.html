<script>
'use strict';
/* Financial Decision Studio — deterministic core, audit ledger and decision science. */
const FDSCore = (() => {
  const ENGINE_VERSION='3.0.0';
  const SCHEMA_VERSION='2.1.0';
  const EPS=1e-8;
  const deepClone=o=>JSON.parse(JSON.stringify(o));
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const round2=x=>Math.round((x+Number.EPSILON)*100)/100;
  const finite=x=>Number.isFinite(x)?x:0;
  const uid=(p='id')=>`${p}_${Math.random().toString(36).slice(2,9)}${Date.now().toString(36).slice(-4)}`;
  const ymToIndex=(startYM,targetYM)=>{const [sy,sm]=startYM.split('-').map(Number),[ty,tm]=targetYM.split('-').map(Number);return (ty-sy)*12+(tm-sm);};
  const indexToYM=(startYM,idx)=>{const [sy,sm]=startYM.split('-').map(Number),z=sy*12+(sm-1)+idx;return `${Math.floor(z/12)}-${String(z%12+1).padStart(2,'0')}`;};
  const annualToMonthly=r=>Math.pow(Math.max(1e-9,1+r),1/12)-1;
  const calcPMT=(r,n,pv)=>{if(n<=0)return 0;if(Math.abs(r)<1e-14)return pv/n;return pv*r/(1-Math.pow(1+r,-n));};
  const percentile=(arr,p)=>{if(!arr.length)return NaN;const a=arr.slice().sort((x,y)=>x-y),pos=(a.length-1)*p,lo=Math.floor(pos),hi=Math.ceil(pos);return lo===hi?a[lo]:a[lo]+(a[hi]-a[lo])*(pos-lo);};

 state.activeScenarioId=(state.plan.scenarios||[]).some(s=>s.id===state.activeScenarioId)?state.activeScenarioId:state.plan.baselineScenarioId;state.rentBuyDraft=rentBuyFromPlan();state.historyBase=JSON.stringify(state.plan);recalculate();render();if(state.encryptedPending)promptDecryptEmbedded();}

function rentBuyFromPlan(){const h=state.plan.housing||{},b=h.buy||{},r=h.rent||{},eq=(state.plan.assets||[]).find(a=>a.assetClass==='equity')||state.plan.assets?.[0];return{horizonYears:Math.round(state.plan.meta.horizonMonths/12),homePrice:b.homePrice||250000,houseApprec:b.homeAppreciation||.02,purchaseCostFixed:b.purchaseCosts||18000,rentMode:'direct',rentalYield:((r.monthlyRent||850)*12)/(b.homePrice||250000),directRent:r.monthlyRent||850,rentGrowth:r.growthRate||.02,rentDepositMonths:r.depositMonths||0,rentInitialCosts:r.initialCosts||600,ltv:b.ltv??.8,mortRate:b.mortgageRate||.03,mortTermYears:b.mortgageTermYears||30,mortUpfrontCosts:0,maintenancePct:b.maintenanceRate||.01,ownerFixedAnnual:b.insuranceAnnual||300,ownerFixedGrowth:state.plan.assumptions.inflation||.02,etfReturn:eq?.expectedReturn??.07,etfTER:eq?.feeRate??.002,saleCostPct:b.saleCostRate||.03,terminalMetric:'keep',includeCash:false};}

function recalculate(){const resolved=C.resolveScenario(state.plan,state.activeScenarioId),tax=C.TAX_PACKS[resolved.settings.taxPackId]||C.TAX_PACKS.generic;resolved._tax=tax;sim=C.runDeterministic(resolved);scenarioSims=(state.plan.scenarios||[]).map(sc=>{const p=C.resolveScenario(state.plan,sc.id);p._tax=C.TAX_PACKS[p.settings.taxPackId]||C.TAX_PACKS.generic;return{scenario:sc,result:C.runDeterministic(p)};});}
function activeResolved(){return C.resolveScenario(state.plan,state.activeScenarioId);}
function activeScenario(){return(state.plan.scenarios||[]).find(s=>s.id===state.activeScenarioId)||state.plan.scenarios[0];}
function planIssues(){return C.validatePlan(activeResolved());}

function render(){try{charts.forEach(c=>c.destroy?.());charts=[];const root=$('#app');if(!root)return;root.innerHTML=`${headerHTML()}<div class="layout">${sidebarHTML()}<main class="workspace">${pageHTML()}</main></div>${bottomNavHTML()}<div id="modalRoot"></div><div id="toast" class="toast"></div>`;bindGlobal();bindPage();setTimeout(()=>{try{renderCharts();}catch(e){console.error('Chart render failed',e);toast('A chart could not render; calculations remain available.');}},0);}catch(error){renderRecovery(error);}}
function headerHTML(){const issues=planIssues(),block=issues.filter(x=>x.severity==='blocking').length,warn=issues.filter(x=>x.severity==='warning').length,status=block?'error':warn?'warning':'';return `<header class="app-header"><div class="header-inner"><div class="brand"><div class="brandmark">FD</div><div><h1>Financial Decision Studio</h1><p>Local-first financial planning and decision intelligence</p></div></div><div class="header-actions"><span class="status-pill ${status}"><span class="status-dot"></span><span>${block?`${block} blocking issue${block>1?'s':''}`:warn?`${warn} warning${warn>1?'s':''}`:'Inputs valid'}</span></span><button class="btn icon hide-small" data-action="undo" title="Undo" ${state.undo.length?'':'disabled'}>↶</button><button class="btn icon hide-small" data-action="redo" title="Redo" ${state.redo.length?'':'disabled'}>↷</button><span class="status-pill desktop-only ${state.storageMode==='memory'?'warning':''}"><span id="saveState">${storageLabel()}</span></span><button class="btn hide-small" data-action="share">Share</button><button class="btn hide-small" data-action="export">Export</button><button class="btn icon" data-action="theme" title="Theme">◐</button><button class="btn icon" data-action="menu" title="Data & settings">⋯</button></div></div></header>`;}function sidebarHTML(){return `<aside class="sidebar"><div class="side-card"><div class="nav-list">${nav.map(([id,ic,l])=>`<button class="nav-btn ${state.activeMode===id?'active':''}" data-nav="${id}"><span class="nav-ico">${ic}</span>${l}</button>`).join('')}</div></div><div class="side-card"><div class="section-title">Active scenario</div><select class="select" id="sideScenario">${state.plan.scenarios.map(s=>`<option value="${s.id}" ${s.id===state.activeScenarioId?'selected':''}>${esc(s.name)}</option>`).join('')}</select><div class="side-meta">Engine ${C.ENGINE_VERSION}<br>Schema ${C.SCHEMA_VERSION}<br>${BUILD_ID}<br>Offline by default</div></div></aside>`;}
function bottomNavHTML(){return `<nav class="bottom-nav">${nav.map(([id,ic,l])=>`<button class="${state.activeMode===id?'active':''}" data-nav="${id}"><span>${ic}</span><span>${l}</span></button>`).join('')}</nav>`;}
function pageHTML(){if(!sim?.ok)return invalidPlanHTML();switch(state.activeMode){case'decisions':return decisionsHTML();case'goals':return goalsHTML();case'optimize':return optimizeHTML();case'lab':return labHTML();default:return planHTML();}}
function invalidPlanHTML(){return `<div class="page-head"><div><h2>Plan needs attention</h2><p>Resolve blocking validation issues before simulation.</p></div></div>${issuesHTML(planIssues())}`;}
function pageHead(title,sub,actions=''){return `<div class="page-head"><div><h2>${title}</h2><p>${sub}</p></div><div class="page-actions">${actions}</div></div>`;}

function planStatus(){if(!sim.ok)return['Incomplete','bad'];if(sim.failed)return['Off track','bad'];const required=sim.goals.filter(g=>g.priority==='hard'||g.priority==='target');if(required.some(g=>g.status==='off_track'))return['Off track','bad'];if(required.some(g=>g.priority==='target'&&g.status==='marginal'))return['Needs attention','warn'];const rs=state.riskResult?.summaries?.find(x=>x.scenarioId===state.activeScenarioId)?.summary;if(rs&&rs.goalSuccess<(state.plan.settings.planStatusThreshold??.9))return['At risk','warn'];return['On track','good'];}
function debtFreeDate(){const r=sim.monthly.find((x,i)=>i>0&&x.debt<.01);return r?r.ym:'—';}
function primaryGoal(){return sim.goals[0];}
function planHTML(){const f=sim.final,g=primaryGoal(),[status,cls]=planStatus(),issues=planIssues(),details=state.disclosure==='simple'?'':`<div class="grid-2" style="margin-top:12px"><section class="card">${entitySectionHTML('Income & expenses','income')}</section><section class="card">${entitySectionHTML('Portfolio','portfolio')}</section><section class="card">${housingSectionHTML()}</section><section class="card">${actualSectionHTML()}</section></div>`,expert=state.disclosure==='expert'?`<section class="card" style="margin-top:12px"><div class="callout"><b>Expert mode</b> exposes the full plan JSON, tax assumptions, policies, correlation matrix, ledger and audit tools in Lab → Data / Audit. Normal financial state is unchanged by disclosure level.</div></section>`:'';return `${pageHead('Your financial plan','A monthly nominal projection built from household cash flows, assets, liabilities, housing and goals.',`<div class="tabs disclosure-tabs"><button class="tab ${state.disclosure==='simple'?'active':''}" data-disclosure="simple">Simple</button><button class="tab ${state.disclosure==='detailed'?'active':''}" data-disclosure="detailed">Detailed</button><button class="tab ${state.disclosure==='expert'?'active':''}" data-disclosure="expert">Expert</button></div><button class="btn" data-action="newblank">Blank plan</button><button class="btn soft" data-action="checkpoint">Checkpoint</button>`)}${state.recoveryMessage?`<div class="banner"><div><h3>Recovery mode</h3><p>${esc(state.recoveryMessage)} The safe default plan is open in session-only mode. Import or export explicitly before relying on persistence.</p></div></div>`:''}${state.firstRun?`<div class="banner"><div><h3>Start with the question, not the machinery</h3><p>Use Quick Decision for a focused Rent-vs-Buy comparison, keep the example to explore, or build your own plan.</p></div><div class="first-run-actions"><button class="btn primary" data-action="quickDecision">Quick Decision</button> <button class="btn" data-action="dismissFirst">Explore example</button> <button class="btn" data-action="buildPlan">Build my plan</button></div></div>`:''}<div class="kpi-grid">${kpi('Projected net worth',fmtMoney(f.netWorth),`at ${f.ym}`,'')}${kpi('Liquid net worth',fmtMoney(f.liquidNetWorth),`${(f.liquidNetWorth/Math.max(1,Math.abs(f.netWorth))*100).toFixed(0)}% of net worth`,'')}${kpi('Primary goal',g?`${Math.min(999,g.fundingRatio*100).toFixed(0)}%`:'—',g?`${g.priority} · ${g.status.replace('_',' ')}`:'No goal',g?.status==='on_track'?'goodk':g?.status==='marginal'?'warnk':'badk')}${kpi('Liquidity runway',f.runway>120?'120+ mo':`${f.runway.toFixed(1)} mo`,'accessible wealth / essential outflow',f.runway<6?'badk':f.runway<12?'warnk':'goodk')}${kpi('Debt free',debtFreeDate(),f.debt>0?`${fmtMoney(f.debt)} remaining`:'No debt','')}${kpi('Plan status',status,sim.failed?`Failure: ${sim.failureReason}`:`${issues.length} validation note${issues.length===1?'':'s'}`,cls==='good'?'goodk':cls==='warn'?'warnk':'badk')}</div><div class="grid-2"><section class="card"><div class="card-head"><div><h3>Wealth trajectory</h3><p>Tap or hover to inspect. Drag horizontally to zoom; double-tap / double-click resets.</p></div><div class="card-actions"><button class="btn" data-chart-full="wealthChart">Full screen</button></div></div><div class="chart" id="wealthChart"></div></section><section class="card"><div class="card-head"><div><h3>Balance-sheet composition</h3><p>Assets and debt over time.</p></div></div><div class="chart" id="balanceChart"></div></section></div><section class="card" style="margin-top:12px"><div class="card-head"><div><h3>Fast assumptions</h3><p>Decision-critical controls first. Detailed entities remain behind progressive disclosure.</p></div><div class="card-actions"><button class="btn" data-action="resetExample">Reset example</button></div></div><div class="quick-controls">${quickControlsHTML()}</div></section>${state.disclosure==='simple'?`<section class="card" style="margin-top:12px"><div class="callout">Need accounts, individual assets, debts, additional properties or actual-vs-plan checkpoints? Switch to <b>Detailed</b>. Expert assumptions remain in Lab.</div></section>`:details}${expert}`;}
function kpi(l,v,s,c=''){return `<section class="card kpi ${c}"><div class="kpi-label">${l}</div><div class="kpi-value mono">${v}</div><div class="kpi-sub">${s}</div></section>`;}
function slider(label,path,min,max,step,format='number'){const v=getPath(state.plan,path),disp=format==='money'?fmtMoney(v):format==='pct'?fmtPct(v):format==='years'?`${v} y`:fmtNum(v,2);return `<div class="control"><div class="control-top"><span class="control-label">${label}</span><span class="control-val mono" data-value-for="${path}">${disp}</span></div><div class="control-row"><input class="range" type="range" min="${min}" max="${max}" step="${step}" value="${v}" data-plan-range="${path}" data-format="${format}"><input class="input mono" type="number" min="${min}" max="${max}" step="${step}" value="${v}" data-plan-number="${path}" data-format="${format}"></div></div>`;}
function quickControlsHTML(){const inc=state.plan.incomeStreams[0],exp=state.plan.expenseStreams[0],h=state.plan.housing,b=h.buy,r=h.rent,eq=state.plan.assets.find(a=>a.assetClass==='equity')||state.plan.assets[0];return `${slider('Analysis horizon','meta.horizonMonths',60,600,12,'months')}${slider('Starting cash','accounts.0.openingCashBalance',0,250000,1000,'money')}${slider('Monthly income','incomeStreams.0.amount',0,15000,50,'money')}${slider('Essential living costs','expenseStreams.0.amount',0,10000,50,'money')}<div class="control"><div class="control-top"><span class="control-label">Housing strategy</span><span class="control-val">${esc(h.strategy)}</span></div><select class="select" data-plan-select="housing.strategy"><option value="rent" ${h.strategy==='rent'?'selected':''}>Rent</option><option value="buy" ${h.strategy==='buy'?'selected':''}>Own / buy</option><option value="none" ${h.strategy==='none'?'selected':''}>No housing cost</option></select></div>${h.strategy==='rent'?slider('Monthly rent','housing.rent.monthlyRent',100,5000,25,'money'):slider('Home price','housing.buy.homePrice',50000,1500000,5000,'money')}${h.strategy==='buy'?slider('Mortgage rate','housing.buy.mortgageRate',0,.10,.0005,'pct'):slider('Rent growth','housing.rent.growthRate',-.02,.10,.001,'pct')}${h.strategy==='buy'?slider('Loan-to-value','housing.buy.ltv',0,1,.01,'pct'):''}${slider('Equity expected return',`assets.${state.plan.assets.indexOf(eq)}.expectedReturn`,-.05,.15,.0025,'pct')}${slider('Inflation','assumptions.inflation',-.02,.10,.001,'pct')}${slider('Minimum cash reserve','settings.minimumCashMonths',0,24,1,'months')}${slider('Additional net cash flow','settings.additionalMonthlySavings',0,5000,25,'money')}`;}
function entitySectionHTML(title,type){if(type==='income'){const list=[...state.plan.incomeStreams.map(x=>({kind:'income',title:x.name,sub:`${fmtMoney(x.amount)}/${x.frequency==='monthly'?'mo':x.frequency} · growth ${fmtPct(x.growthRate||0)}`,id:x.id})),...state.plan.expenseStreams.map(x=>({kind:'expense',title:x.name,sub:`−${fmtMoney(x.amount)}/${x.frequency==='monthly'?'mo':x.frequency} · ${x.priority}`,id:x.id}))];return `<div class="card-head"><div><h3>${title}</h3><p>Recurring household resources and spending.</p></div><div class="card-actions"><button class="btn" data-add="income">+ Income</button><button class="btn" data-add="expense">+ Expense</button></div></div><div class="entity-list">${list.map(entityHTML).join('')||'<div class="muted">No streams.</div>'}</div>`;}
 const list=state.plan.holdings.map(h=>{const a=state.plan.assets.find(a=>a.id===h.assetId);return{kind:'asset',id:a?.id,title:a?.name||h.assetId,sub:`${fmtMoney(h.openingMarketValue)} · target ${fmtPct(h.targetWeight||0)} · return ${fmtPct(a?.expectedReturn||0)} · vol ${fmtPct(a?.volatility||0)}`};});return `<div class="card-head"><div><h3>${title}</h3><p>Multi-asset allocation with independent return, volatility and fee assumptions.</p></div><div class="card-actions"><button class="btn" data-add="asset">+ Asset</button></div></div><div class="entity-list">${list.map(entityHTML).join('')}</div>`;}
function entityHTML(e){return `<div class="entity"><div class="entity-main"><div class="entity-title">${esc(e.title)}</div><div class="entity-sub">${esc(e.sub)}</div></div><div class="entity-actions"><button class="mini-btn" data-edit-kind="${e.kind}" data-edit-id="${e.id}">Edit</button></div></div>`;}
function housingSectionHTML(){const h=state.plan.housing,b=h.buy,r=h.rent;return `<div class="card-head"><div><h3>Housing & debt</h3><p>Primary residence plus transaction, operating and financing assumptions.</p></div><div class="card-actions"><button class="btn" data-action="editHousing">Edit</button></div></div><div class="metric-row"><span>Strategy</span><b>${h.strategy==='buy'?'Own / buy':h.strategy==='rent'?'Rent':'None'}</b></div>${h.strategy==='rent'?`<div class="metric-row"><span>Initial rent</span><b>${fmtMoney(r.monthlyRent)}/mo</b></div><div class="metric-row"><span>Rent growth</span><b>${fmtPct(r.growthRate)}</b></div><div class="metric-row"><span>Security deposit</span><b>${r.depositMonths} months</b></div>`:`<div class="metric-row"><span>Home value</span><b>${fmtMoney(sim.final.property)}</b></div><div class="metric-row"><span>Mortgage balance</span><b>${fmtMoney(sim.final.debt)}</b></div><div class="metric-row"><span>Mortgage rate / LTV</span><b>${fmtPct(b.mortgageRate)} / ${fmtPct(b.ltv)}</b></div><div class="metric-row"><span>Owner cost / appreciation</span><b>${fmtPct(b.maintenanceRate)} / ${fmtPct(b.homeAppreciation)}</b></div>`}`;}
function actualSectionHTML(){const a=state.plan.actualSnapshots||[],latest=a.at(-1),proj=latest?projectedAtYM(latest.ym):null;return `<div class="card-head"><div><h3>Actual vs plan</h3><p>Track reality against the forecast and optionally rebase future projections from an observed checkpoint.</p></div><div class="card-actions"><button class="btn" data-action="snapshot">Record snapshot</button></div></div>${latest?`<div class="metric-row"><span>Latest actual</span><b>${esc(latest.ym)} · ${fmtMoney(latest.netWorth)}</b></div><div class="metric-row"><span>Projected at that month</span><b>${proj?fmtMoney(proj.netWorth):'Outside current projection'}</b></div><div class="metric-row"><span>Variance</span><b class="${proj&&latest.netWorth-proj.netWorth>=0?'good':'bad'}">${proj?fmtMoney(latest.netWorth-proj.netWorth):'—'}</b></div><div class="metric-row"><span>Observed composition</span><b>${latest.cash!=null?`Cash ${fmtMoney(latest.cash)} · Investments ${fmtMoney(latest.investments||0)}`:'Legacy snapshot'}</b></div><div style="margin-top:9px"><button class="btn" data-action="rebaseSnapshot" data-snapshot-id="${latest.id||''}" ${latest.cash==null?'disabled':''}>Rebase future plan from this snapshot</button></div>`:`<div class="callout">No actual snapshots yet. Add one periodically to see whether reality is ahead of or behind the plan.</div>`}<div class="chart small" id="actualChart" style="margin-top:10px"></div>`;}function projectedAtYM(ym){return sim.monthly.find(r=>r.ym===ym);}

function decisionsHTML(){return `${pageHead('Decisions','Branch the same household into alternative strategies, compare them on identical resources, and inspect what changes the answer.',`<button class="btn primary" data-action="newScenario">+ Scenario</button>`)}<section class="card"><div class="card-head"><div><h3>Scenario manager</h3><p>Scenarios inherit the baseline and store only differences. Select one to make it active.</p></div></div>${scenarioTableHTML()}</section><div class="grid-2" style="margin-top:12px"><section class="card"><div class="card-head"><div><h3>Scenario comparison</h3><p>Common household resources; active assumptions resolve independently per branch.</p></div></div><div class="chart" id="scenarioChart"></div></section><section class="card"><div class="card-head"><div><h3>Decision templates</h3><p>Templates create or analyze branches using the same financial engine.</p></div></div><div class="tabs">${[['rentbuy','Rent vs Buy'],['prepay','Prepay vs Invest'],['refi','Refinance'],['retirement','Retirement'],['purchase','Big Purchase']].map(([id,l])=>`<button class="tab ${state.decisionTab===id?'active':''}" data-decision-tab="${id}">${l}</button>`).join('')}</div>${decisionTemplateHTML()}</section></div>`;}
function scenarioTableHTML(){return `<div class="table-wrap"><div class="scenario-row header"><div>Scenario</div><div>Net worth</div><div>Liquid</div><div>Goal</div><div>Min runway</div><div>Status</div><div></div></div>${scenarioSims.map(({scenario,result})=>{const goal=result.ok?result.goals[0]:null,min=result.ok?Math.min(...result.monthly.map(x=>x.runway)):NaN;return `<div class="scenario-row"><div><button class="mini-btn ${scenario.id===state.activeScenarioId?'soft':''}" data-scenario="${scenario.id}"><span class="scenario-name">${esc(scenario.name)}</span></button> ${scenario.id===state.plan.baselineScenarioId?'<span class="chip">Baseline</span>':''}</div><div class="mono">${result.ok?fmtMoney(result.final.netWorth):'Invalid'}</div><div class="mono">${result.ok?fmtMoney(result.final.liquidNetWorth):'—'}</div><div>${goal?`${(goal.fundingRatio*100).toFixed(0)}%`:'—'}</div><div>${Number.isFinite(min)?(min>120?'120+':min.toFixed(1))+' mo':'—'}</div><div>${result.failed?'<span class="bad">Failed</span>':'<span class="good">Feasible</span>'}</div><div class="entity-actions"><button class="mini-btn" data-scen-clone="${scenario.id}">Branch</button>${scenario.id!==state.plan.baselineScenarioId?`<button class="mini-btn" data-scen-edit="${scenario.id}">Edit</button><button class="mini-btn" data-scen-del="${scenario.id}">×</button>`:''}</div></div>`;}).join('')}</div>`;}
function decisionTemplateHTML(){if(state.decisionTab==='prepay')return prepayHTML();if(state.decisionTab==='refi')return refiHTML();if(state.decisionTab==='retirement')return retirementHTML();if(state.decisionTab==='purchase')return purchaseHTML();return rentBuyHTML();}
function dslider(label,key,min,max,step,format='number'){const v=state.rentBuyDraft[key],disp=format==='money'?fmtMoney(v):format==='pct'?fmtPct(v):format==='years'?`${v}y`:String(v);return `<div class="control"><div class="control-top"><span class="control-label">${label}</span><span class="control-val">${disp}</span></div><div class="control-row"><input class="range" data-decision-range="${key}" type="range" min="${min}" max="${max}" step="${step}" value="${v}"><input class="input mono" data-decision-number="${key}" type="number" min="${min}" max="${max}" step="${step}" value="${v}"></div></div>`;}
function rentBuyHTML(){const d=state.rentBuyDraft,r=C.legacyRentBuy(d),f=r.final,adv=f.mortNW-f.rentNW;return `<div class="quick-controls" style="grid-template-columns:1fr 1fr">${dslider('Home price','homePrice',50000,1000000,5000,'money')}${dslider('Monthly rent','directRent',100,5000,25,'money')}${dslider('Mortgage rate','mortRate',0,.10,.0005,'pct')}${dslider('Loan-to-value','ltv',0,1,.01,'pct')}${dslider('Home appreciation','houseApprec',-.05,.10,.001,'pct')}${dslider('Portfolio return','etfReturn',-.05,.15,.0025,'pct')}</div><div class="metric-row"><span>Rent + invest</span><b>${fmtMoney(f.rentNW)}</b></div><div class="metric-row"><span>Buy with mortgage</span><b>${fmtMoney(f.mortNW)}</b></div><div class="metric-row"><span>Mortgage − Rent</span><b class="${adv>=0?'good':'bad'}">${adv>=0?'+':''}${fmtMoney(adv)}</b></div><div class="metric-row"><span>Mortgage payment</span><b>${fmtMoney(r.pmt)}/mo</b></div><div class="split-bar" style="margin-top:9px"><button class="btn primary" data-action="createRentBuyScenarios">Create Rent / Buy scenarios</button><button class="btn" data-action="openRentBuyLab">Open sensitivity</button></div>`;}
function prepayHTML(){const p=activeResolved(),b=p.housing.buy;if(p.housing.strategy!=='buy')return `<div class="callout">Set the active plan or scenario to Own / buy before running this template.</div>`;const x=Math.max(100,b.extraPrincipalMonthly||500),common=deep(p);common.housing.buy.extraPrincipalMonthly=0;common.settings.plannedInvestmentMonthly=0;const base=C.runDeterministic(common),pre=deep(common);pre.housing.buy.extraPrincipalMonthly=x;const rp=C.runDeterministic(pre),inv=deep(common);inv.settings.plannedInvestmentMonthly=x;const ri=C.runDeterministic(inv);return `<div class="metric-row"><span>Scheduled mortgage only</span><b>${fmtMoney(base.final.netWorth)}</b></div><div class="metric-row"><span>Extra principal (${fmtMoney(x)}/mo)</span><b>${fmtMoney(rp.final.netWorth)}</b></div><div class="metric-row"><span>Invest same cash allocation</span><b>${fmtMoney(ri.final.netWorth)}</b></div><div class="callout" style="margin-top:9px"><b>Fair comparison:</b> both branches start from the same household and the same external resources. The ${fmtMoney(x)}/mo allocation is applied after the reserve rule either to mortgage principal or investments; it is not booked as new income.</div>`;}
function refiHTML(){const p=activeResolved(),b=p.housing.buy;if(p.housing.strategy!=='buy')return `<div class="callout">A mortgage scenario is required.</div>`;const existing=b.acquisitionMode==='existing',principal=existing?Math.max(0,b.currentMortgageBalance||0):Math.max(0,(b.homePrice||0)*(b.ltv||0)),months=Math.max(1,Math.round((existing?(b.remainingTermYears||b.mortgageTermYears||30):(b.mortgageTermYears||30))*12)),newRate=Math.max(0,(b.mortgageRate||0)-.01),cur=C.calcPMT((b.mortgageRate||0)/12,months,principal),neu=C.calcPMT(newRate/12,months,principal);return `<div class="metric-row"><span>Current balance</span><b>${fmtMoney(principal)}</b></div><div class="metric-row"><span>Remaining term</span><b>${(months/12).toFixed(1)} years</b></div><div class="metric-row"><span>Current rate / payment</span><b>${fmtPct(b.mortgageRate)} · ${fmtMoney(cur)}/mo</b></div><div class="metric-row"><span>Illustrative new rate / payment</span><b>${fmtPct(newRate)} · ${fmtMoney(neu)}/mo</b></div><div class="metric-row"><span>Monthly payment difference</span><b>${fmtMoney(cur-neu)}</b></div><div class="callout" style="margin-top:9px">Economic screen only. Availability, eligibility, fees and timing must be modeled explicitly in a scenario before relying on a refinance result.</div>`;}

function optimizeHTML(){const homePrice=C.affordableHomePrice(state.plan,state.activeScenarioId,{minRunway:state.plan.settings.minimumCashMonths,maxPrice:1500000}),ltv=C.optimizeLTV(state.plan,state.activeScenarioId,{steps:21,minRunway:state.plan.settings.minimumCashMonths}),g=sim.goals.find(x=>x.priority!=='aspirational')||sim.goals[0],req=g?C.goalSolver(state.plan,state.activeScenarioId,g.id,0,10000):null,existing=activeResolved().housing?.strategy==='buy'&&activeResolved().housing?.buy?.acquisitionMode==='existing';return `${pageHead('Optimize','Bounded deterministic solvers under explicit financial constraints. Results become scenarios only when you choose to apply them.')}<div class="grid-3"><section class="card"><div class="card-head"><div><h3>Affordable home price</h3><p>Highest new-purchase price preserving the current minimum-runway constraint.</p></div></div><div class="kpi-value">${existing?'New-purchase scenario required':homePrice==null?'Not feasible':fmtMoney(homePrice)}</div><div class="kpi-sub">Constraint: ≥ ${state.plan.settings.minimumCashMonths} months of liquidity runway.</div>${!existing&&homePrice!=null?`<button class="btn" style="margin-top:10px" data-opt-apply="home" data-opt-value="${homePrice}">Create scenario</button>`:''}</section><section class="card"><div class="card-head"><div><h3>LTV search</h3><p>Terminal objective across feasible leverage levels for a new purchase.</p></div></div><div class="kpi-value">${existing?'New-purchase scenario required':ltv.best?fmtPct(ltv.best.ltv):'No feasible LTV'}</div><div class="kpi-sub">${existing?'Current debt is governed by current mortgage balance, so LTV is not an optimization variable.':ltv.best?`Objective ${fmtMoney(ltv.best.netWorth)} · min runway ${ltv.best.minRunway.toFixed(1)} mo`:(ltv.error||'Relax constraints or increase starting liquidity.')}</div>${!existing&&ltv.best?`<button class="btn" style="margin-top:10px" data-opt-apply="ltv" data-opt-value="${ltv.best.ltv}">Create scenario</button>`:''}</section><section class="card"><div class="card-head"><div><h3>Required external monthly capacity</h3><p>Additional net monthly cash flow required to reach the selected deterministic goal.</p></div></div><div class="kpi-value">${req==null?'Not solvable':req===0?'Already funded':`${fmtMoney(req)}/mo`}</div><div class="kpi-sub">This is explicitly an external-resource requirement, not a reallocation of money already present in the plan.</div>${req>0?`<button class="btn" style="margin-top:10px" data-opt-apply="savings" data-opt-value="${req}">Create scenario</button>`:''}</section></div><div class="grid-2" style="margin-top:12px">${existing?'':`<section class="card"><div class="card-head"><div><h3>Leverage frontier</h3><p>Objective versus minimum liquidity across tested LTV choices.</p></div></div><div class="chart" id="ltvChart"></div></section>`}<section class="card"><div class="card-head"><div><h3>Decision discipline</h3><p>Search and validation are deliberately separated.</p></div></div><div class="callout">These solvers are transparent deterministic searches, not Differential Evolution, NSGA-II or a stochastic optimizer. Stress-test a selected candidate in Lab before adoption.</div><div class="metric-row"><span>Current minimum cash runway</span><b>${state.plan.settings.minimumCashMonths} months</b></div><div class="metric-row"><span>Primary objective</span><b>${state.plan.settings.terminalLiquidation?'Liquidated terminal net worth':'Terminal net worth'} subject to liquidity</b></div><div class="metric-row"><span>Scenario changes</span><b>Never auto-applied</b></div></section></div>`;}
function labHTML(){const tabs=[['risk','Risk'],['robustness','Robustness'],['sensitivity','Sensitivity'],['attribution','Attribution'],['ledger','Ledger'],['data','Data'],['audit','Audit']];return `${pageHead('Lab','Advanced risk, decision science, assumptions, accounting and reproducibility controls.')}<div class="tabs">${tabs.map(([id,l])=>`<button class="tab ${state.labTab===id?'active':''}" data-lab-tab="${id}">${l}</button>`).join('')}</div>${state.labTab==='robustness'?robustnessHTML():state.labTab==='sensitivity'?sensitivityHTML():state.labTab==='attribution'?attributionHTML():state.labTab==='ledger'?ledgerHTML():state.labTab==='data'?dataHTML():state.labTab==='audit'?auditHTML():riskHTML()}`;}function riskHTML(){const rr=state.riskResult;return `<div class="grid-2"><section class="card"><div class="card-head"><div><h3>Monte Carlo risk simulation</h3><p>Correlated multi-asset shocks, property volatility and pathwise liquidity failure. Compared scenarios share stable driver-keyed shocks.</p></div>${state.riskRunning?'<button class="btn danger" data-action="cancelRisk">Cancel</button>': '<button class="btn primary" data-action="runRisk">Run simulation</button>'}</div><div class="quick-controls" style="grid-template-columns:1fr 1fr"><div class="control"><div class="control-top"><span class="control-label">Paths</span><span class="control-val">${state.plan.riskSettings?.paths||2000}</span></div><input class="range" data-risk="paths" type="range" min="500" max="20000" step="500" value="${state.plan.riskSettings?.paths||2000}"></div><div class="control"><div class="control-top"><span class="control-label">Seed</span><span class="control-val">${state.plan.riskSettings?.seed||20260826}</span></div><input class="input" data-risk-number="seed" type="number" value="${state.plan.riskSettings?.seed||20260826}"></div></div>${state.riskRunning?`<div class="progress" style="margin-top:12px"><span style="width:${state.riskProgress*100}%"></span></div>`:''}${rr?riskSummaryHTML function riskSummaryHTML(rr){const s=rr.summaries.find(x=>x.scenarioId===state.activeScenarioId)||rr.summaries[0];if(!s)return'';const q=s.summary,ci=q.goalSuccessCI||C.wilson(Math.round(q.goalSuccess*q.n),q.n),fci=q.liquidityFailureCI||C.wilson(Math.round(q.liquidityFailure*q.n),q.n);return `<div class="grid-4" style="margin-top:12px"><div class="control"><div class="kpi-label">Median terminal</div><div class="kpi-value">${fmtMoney(q.terminal.p50)}</div><div class="kpi-sub">Unconditional · seed ${rr.seed??state.plan.riskSettings?.seed}</div></div><div class="control"><div class="kpi-label">P10 / P90</div><div class="kpi-value" style="font-size:15px">${fmtMoney(q.terminal.p10)} / ${fmtMoney(q.terminal.p90)}</div></div><div class="control"><div class="kpi-label">Goal success</div><div class="kpi-value">${fmtPct(q.goalSuccess)}</div><div class="kpi-sub">95% CI ${fmtPct(ci.lo)}–${fmtPct(ci.hi)} · N=${q.n}</div></div><div class="control"><div class="kpi-label">Liquidity failure</div><div class="kpi-value ${q.liquidityFailure>0?'bad':''}">${fmtPct(q.liquidityFailure)}</div><div class="kpi-sub">95% CI ${fmtPct(fci.lo)}–${fmtPct(fci.hi)}</div></div></div><div class="grid-3" style="margin-top:9px"><div class="control"><div class="kpi-label">P5 minimum liquidity</div><div class="control-val">${fmtMoney(q.minLiquidity?.p5)}</div></div><div class="control"><div class="kpi-label">Median max drawdown</div><div class="control-val">${fmtPct(q.maxDrawdown?.p50||0)}</div></div><div class="control"><div class="kpi-label">P95 max drawdown</div><div class="control-val">${fmtPct(q.maxDrawdown?.p95||0)}</div></div></div>${q.liquidityFailure>0?`<div class="callout" style="margin-top:9px">Failed paths are included in the unconditional terminal distribution at their failure state and reported separately through liquidity failure. Survivor-only median: <b>${fmtMoney(q.survivorTerminal?.p50)}</b>.</div>`:''}`;}function robustnessHTML(){const d=state.rentBuyDraft,r=C.robustnessRentBuy(d,{samples:1000,seed:state.plan.riskSettings?.seed||20260826}),delta=r.delta;const crit=r.critical.slice(0,6),max=Math.max(...crit.map(x=>Math.abs(x[1])),.001),labels={mortRate:'Mortgage rate',directRent:'Monthly rent',etfReturn:'Portfolio return',houseApprec:'Home appreciation',rentGrowth:'Rent growth',maintenancePct:'Owner costs'};return `<div class="grid-2"><section class="card"><div class="card-head"><div><h3>Assumption robustness</h3><p>1,000 deterministic assumption states around the current controlled Rent-vs-Buy decision. This tests parameter uncertainty separately from path randomness.</p></div></div><div class="grid-3"><div class="control"><div class="kpi-label">Buy win rate</div><div class="kpi-value">${fmtPct(r.buyWinRate)}</div></div><div class="control"><div class="kpi-label">Median Buy − Rent</div><div class="kpi-value ${delta.p50>=0?'good':'bad'}">${fmtMoney(delta.p50)}</div></div><div class="control"><div class="kpi-label">P5 / P95 decision delta</div><div class="control-val">${fmtMoney(delta.p5)} / ${fmtMoney(delta.p95)}</div></div></div><div class="metric-row"><span>Mean absolute regret proxy</span><b>${fmtMoney(r.regret.mean)}</b></div><div class="metric-row"><span>P95 regret proxy</span><b>${fmtMoney(r.regret.p95)}</b></div><div class="callout" style="margin-top:10px">A high base-case advantage is not the same as a robust decision. Robustness asks whether the answer survives plausible assumption error.</div></section><section class="card"><div class="card-head"><div><h3>Decision-critical assumptions</h3><p>Rank correlation with the Buy − Rent outcome. Longer bars indicate assumptions that move the result most strongly in this sampling region.</p></div></div>${crit.map(([k,v])=>`<div style="margin:11px 0"><div class="metric-row" style="border:0;padding:0 0 5px"><span>${labels[k]||esc(k)}</span><b>${v>=0?'+':''}${v.toFixed(2)}</b></div><div class="progress"><span style="width:${Math.abs(v)/max*100}%;background:${v>=0?'var(--good)':'var(--blue)'}"></span></div></div>`).join('')}</section></div><section class="card" style="margin-top:12px"><div class="card-head"><div><h3>Robust decision interpretation</h3><p>Transparent primitives rather than a magic score.</p></div></div><div class="grid-4"><div class="control"><div class="kpi-label">Base case</div><div class="control-val">${C.legacyRentBuy(d).final.mortNW>=C.legacyRentBuy(d).final.rentNW?'Buy':'Rent'}</div></div><div class="control"><div class="kpi-label">Robust winner</div><div class="control-val">${r.buyWinRate>.7?'Buy':r.buyWinRate<.3?'Rent':'No dominant choice'}</div></div><div class="control"><div class="kpi-label">Ambiguity band</div><div class="control-val">${r.buyWinRate>=.3&&r.buyWinRate<=.7?'High':'Lower'}</div></div><div class="control"><div class="kpi-label">Samples</div><div class="control-val">${r.samples}</div></div></div></section>`;}
function attributionHTML(){const sc=activeScenario();if(sc.id===state.plan.baselineScenarioId)return `<section class="card"><div class="card-head"><div><h3>Scenario attribution</h3><p>Select a child scenario to explain how its patches changed terminal net worth relative to an ancestor.</p></div></div><div class="callout">The baseline has no parent delta to attribute. Create or select a scenario in Decisions.</div></section>`;const a=C.scenarioPatchAttribution(state.plan,state.plan.baselineScenarioId,sc.id);if(!a||a.error)return `<section class="card"><div class="callout">${esc(a?.error||'Attribution unavailable for this scenario relationship.')}</div></section>`;const max=Math.max(...a.contrib.map(x=>Math.abs(x.value)),1);return `<div class="grid-2"><section class="card"><div class="card-head"><div><h3>Scenario attribution</h3><p>Shapley-style decomposition of the active scenario's terminal net-worth difference versus baseline.</p></div></div><div class="metric-row"><span>Baseline</span><b>${fmtMoney(a.base)}</b></div><div class="metric-row"><span>Active scenario</span><b>${fmtMoney(a.target)}</b></div><div class="metric-row"><span>Total delta</span><b class="${a.total>=0?'good':'bad'}">${a.total>=0?'+':''}${fmtMoney(a.total)}</b></div><div class="metric-row"><span>Method</span><b>${a.exact?'Exact Shapley':'Permutation-sampled'} · ${a.groups} groups</b></div><div class="metric-row"><span>Residual</span><b>${fmtMoney(a.residual)}</b></div></section><section class="card"><div class="card-head"><div><h3>Outcome drivers</h3><p>Positive bars add to active-scenario wealth; negative bars reduce it.</p></div></div>${a.contrib.sort((x,y)=>Math.abs(y.value)-Math.abs(x.value)).map(x=>`<div style="margin:11px 0"><div class="metric-row" style="border:0;padding:0 0 5px"><span>${esc(x.name)}</span><b class="${x.value>=0?'good':'bad'}">${x.value>=0?'+':''}${fmtMoney(x.value)}</b></div><div style="height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden"><span style="display:block;height:100%;width:${Math.abs(x.value)/max*100}%;background:${x.value>=0?'var(--good)':'var(--bad)'}"></span></div></div>`).join('')||'<div class="callout">No material patches to attribute.</div>'}</section></div>`;}
function sensitivityHTML(){const d=state.rentBuyDraft,centerX=d.mortRate,centerY=d.directRent,xVals=Array.from({length:7},(_,i)=>Math.max(0,centerX+(i-3)*.005)),yVals=Array.from({length:7},(_,i)=>Math.max(50,centerY+(i-3)*100)),grid=yVals.map(y=>xVals.map(x=>{const r=C.legacyRentBuy({...d,mortRate:x,directRent:y});return r.final.mortNW-r.final.rentNW;}));state._sens={xVals,yVals,grid};const roots=C.roots(x=>{const r=C.legacyRentBuy({...d,mortRate:x});return r.final.mortNW-r.final.rentNW;},0,.12);return `<div class="grid-2"><section class="card"><div class="card-head"><div><h3>Mortgage rate × rent</h3><p>Cell = Buy with mortgage net worth minus Rent + invest.</p></div></div><div class="table-wrap" style="padding:8px"><div id="heatmap" class="heatmap"></div></div></section><section class="card"><div class="card-head"><div><h3>Decision boundary</h3><p>Break-even and one-at-a-time diagnostics using the focused housing model.</p></div></div><div class="metric-row"><span>Mortgage-rate break-even</span><b>${roots.length?roots.map(x=>fmtPct(x,2)).join(', '):'No crossing in 0–12%'}</b></div><div class="metric-row"><span>Current mortgage − rent delta</span><b>${fmtMoney(C.legacyRentBuy(d).final.mortNW-C.legacyRentBuy(d).final.rentNW)}</b></div><div class="metric-row"><span>Current rent</span><b>${fmtMoney(d.directRent)}/mo</b></div><div class="metric-row"><span>Current home price</span><b>${fmtMoney(d.homePrice)}</b></div><div class="callout" style="margin-top:10px">Sensitivity is intentionally separated from the household baseline so the controlled Rent-vs-Buy experiment remains comparable to the verified legacy model.</div></section></div>`;}
function ledgerHTML(){const entries=sim.ledger.entries,bs=sim.ledger.balanceSheet();return `<div class="grid-2"><section class="card"><div class="card-head"><div><h3>Accounting reconciliation</h3><p>Every financial movement is journaled and balanced.</p></div><button class="btn" data-action="exportLedger">Export CSV</button></div><div class="metric-row"><span>Assets</span><b>${fmtMoney(bs.assets)}</b></div><div class="metric-row"><span>Liabilities</span><b>${fmtMoney(bs.liabilities)}</b></div><div class="metric-row"><span>Net worth</span><b>${fmtMoney(bs.assets-bs.liabilities)}</b></div><div class="metric-row"><span>Journal entries</span><b>${fmtNum(entries.length)}</b></div><div class="metric-row"><span>Ledger status</span><b class="${sim.checks.journalBalanced&&sim.checks.netWorthReconcile?'good':'bad'}">${sim.checks.journalBalanced&&sim.checks.netWorthReconcile?'Reconciled':'Error'}</b></div></section><section class="card"><div class="card-head"><div><h3>Consumed costs</h3><p>Expenses are distinct from asset transfers and debt principal.</p></div></div>${expenseSummaryHTML()}</section></div><section class="card" style="margin-top:12px"><div class="card-head"><div><h3>Journal explorer</h3><p>Latest 250 entries. Export CSV for the complete audit trail.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Month</th><th>Description</th><th>Debit</th><th>Credit</th></tr></thead><tbody>${entries.slice(-250).reverse().map(e=>`<tr><td>${e.month}</td><td>${esc(e.desc)}</td><td>${fmtMoney(e.postings.reduce((s,p)=>s+(p.debit||0),0))}</td><td>${fmtMoney(e.postings.reduce((s,p)=>s+(p.credit||0),0))}</td></tr>`).join('')}</tbody></table></div></section>`;}
function expenseSummaryHTML(){const map={};for(const [k,v] of sim.ledger.balances)if(k.startsWith('E:'))map[k]=v;return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>`<div class="metric-row"><span>${esc(k.replace(/^E:/,'').replaceAll(':',' · '))}</span><b>${fmtMoney(v)}</b></div>`).join('')||'<div class="callout">No consumed costs.</div>';}
function advancedDataSection(title,kind,list,desc){return `<section class="card"><div class="card-head"><div><h3>${title}</h3><p>${desc}</p></div><button class="btn" data-add="${kind}">+ Add</button></div><div class="entity-list">${list.map(x=>{let sub='';if(kind==='liability')sub=`${fmtMoney(x.principal||0)} · ${fmtPct(x.annualRate??x.rate??0)} · ${Math.round(x.termMonths??(x.termYears||5)*12)} months`;if(kind==='property')sub=`${fmtMoney(x.currentValue||x.purchasePrice||0)} · rent ${fmtMoney(x.rentalIncomeMonthly||0)}/mo · appreciation ${fmtPct(x.appreciationRate||0)}`;if(kind==='event')sub=`month ${x.month||0} · ${(x.actions||[]).map(a=>a.type).join(', ')||'no actions'}`;if(kind==='insurance')sub=`${fmtMoney(x.premiumMonthly||0)}/mo · benefit ${fmtMoney(x.benefitAmount||0)}`;if(kind==='person')sub=`${x.role||'adult'} · born ${x.birthYear||'—'} · retirement ${x.retirementYear||'—'}`;if(kind==='policy')sub=`${x.enabled===false?'disabled':'enabled'} · ${String(x.type||'').replaceAll('_',' ')}`;return entityHTML({kind,id:x.id,title:x.name||x.id,sub});}).join('')||'<div class="muted">None configured.</div>'}</div></section>`;}
function dataHTML(){const tax=C.TAX_PACKS[state.plan.settings.taxPackId]||C.TAX_PACKS.generic,props=state.plan.additionalProperties||[],debts=state.plan.liabilities||[],events=state.plan.events||[],ins=state.plan.insurancePolicies||[],persons=state.plan.household?.persons||[],policies=state.plan.policies||[];return `<div class="grid-2"><section class="card"><div class="card-head"><div><h3>Assumptions & tax pack</h3><p>Important assumptions are explicit and editable. The calculation core remains nominal.</p></div></div><div class="metric-row"><span>Inflation</span><b>${fmtPct(state.plan.assumptions.inflation)}</b></div><div class="metric-row"><span>Tax pack</span><b>${esc(tax.name)}</b></div><div class="metric-row"><span>Tax pack version</span><b>${esc(tax.version)}</b></div><div class="metric-row"><span>Investment capital gain</span><b>${fmtPct(tax.investmentCapitalGainRate)}</b></div><div class="metric-row"><span>Investment income</span><b>${fmtPct(tax.investmentIncomeRate??tax.investmentCapitalGainRate)}</b></div><div class="metric-row"><span>Investment stamp assumption</span><b>${fmtPct(tax.investmentStampAnnual)}</b></div><div class="metric-row"><span>Mortgage interest credit</span><b>${fmtPct(tax.mortgageInterestCreditRate)} up to ${fmtMoney(tax.mortgageInterestCreditCap)}</b></div><select class="select" id="taxPackSelect" style="margin-top:10px">${Object.values(C.TAX_PACKS).map(t=>`<option value="${t.id}" ${t.id===state.plan.settings.taxPackId?'selected':''}>${esc(t.name)}</option>`).join('')}</select><div style="margin-top:9px"><button class="btn" data-action="editCorrelation">Edit asset correlation matrix</button></div><div class="help">Tax packs are planning approximations, not filing software. Italy 2026 uses the 2026 headline national IRPEF brackets and simplified financial-tax assumptions. Regional and municipal surtaxes, deductions, tax credits, high-income detraction interactions, special-instrument taxation, preferential sovereign-debt rates, detailed eligibility rules and future-law changes are omitted or simplified. Plans extending beyond the pack effective year are warned and use the configured hold-last assumption.</div></section><section class="card"><div class="card-head"><div><h3>Expert plan JSON</h3><p>Full adaptability without forcing every field into the normal interface.</p></div><div class="card-actions"><button class="btn" data-action="editJSON">Open editor</button></div></div><div class="codebox">${esc(JSON.stringify({meta:state.plan.meta,settings:state.plan.settings,housing:state.plan.housing},null,2))}</div></section></div><div class="grid-2" style="margin-top:12px">${advancedDataSection('Household members','person',persons,'People represented in the household model and retirement timeline.')}${advancedDataSection('Financial policies','policy',policies,'Reserve, surplus-investment and rebalancing rules applied by the engine.')}${advancedDataSection('Other liabilities','liability',debts,'Loans and credit obligations beyond the primary mortgage.')}${advancedDataSection('Additional properties','property',props,'Rental, second-home and future-property cash flows.')}${advancedDataSection('Life events','event',events,'One-time or scheduled inflows, outflows, investments and debt prepayments.')}${advancedDataSection('Insurance & protection','insurance',ins,'Premiums and event-triggered benefits.')}</div><section class="card" style="margin-top:12px"><div class="card-head"><div><h3>Plan health</h3><p>Validation issues are classified as blocking, warning or informational.</p></div></div>${issuesHTML(planIssues())}</section>`;}function auditHTML(){const tests=C.selfTests(),pass=tests.filter(x=>x.pass).length,fp=planFingerprint(),cap=state.capabilities||{};return `<div class="grid-2"><section class="card"><div class="card-head"><div><h3>Embedded diagnostics</h3><p>Fast invariants executed against production financial-core functions.</p></div><span class="status-pill ${pass===tests.length?'':'error'}"><span class="status-dot"></span>${pass}/${tests.length} pass</span></div>${tests.map(t=>`<div class="issue"><div><b>${esc(t.name)}</b><p>${esc(t.detail)}</p></div><span class="sev ${t.pass?'info':'blocking'}">${t.pass?'PASS':'FAIL'}</span></div>`).join('')}</section><section class="card"><div class="card-head"><div><h3>Reproducibility & capabilities</h3><p>Build identity, plan fingerprint and actual runtime capabilities.</p></div></div><div class="metric-row"><span>Build</span><b>${BUILD_ID}</b></div><div class="metric-row"><span>Engine</span><b>${C.ENGINE_VERSION}</b></div><div class="metric-row"><span>Schema</span><b>${C.SCHEMA_VERSION}</b></div><div class="metric-row"><span>App</span><b>${APP_VERSION}</b></div><div class="metric-row"><span>Plan fingerprint</span><b class="mono" id="planHash">${esc(fp)}</b></div><div class="metric-row"><span>Storage mode</span><b class="${state.storageMode==='memory'?'warn':'good'}">${esc(storageLabel())}</b></div><div class="metric-row"><span>IndexedDB API</span><b>${cap.indexedDB?'Detected':'Unavailable'}</b></div><div class="metric-row"><span>localStorage</span><b>${cap.localStorage?'Available':'Unavailable / restricted'}</b></div><div class="metric-row"><span>Web Worker</span><b>${cap.worker?'Available':'Unavailable'}</b></div><div class="metric-row"><span>Web Crypto</span><b>${cap.crypto?'Available':'Unavailable'}</b></div><div class="metric-row"><span>File API</span><b>${cap.fileApi?'Available':'Unavailable'}</b></div><div class="metric-row"><span>Share files</span><b>${cap.share?'Available / browser-dependent':'Download fallback'}</b></div><div class="metric-row"><span>Risk seed / paths</span><b>${state.plan.riskSettings?.seed??'—'} / ${state.plan.riskSettings?.paths??'—'}</b></div><div class="metric-row"><span>Network dependency</span><b class="good">None</b></div><div class="callout" style="margin-top:10px">Browser persistence from a standalone file is best effort. Portable HTML / Plan JSON is the explicit durable backup. Missing optional capabilities degrade visibly rather than producing a blank app.</div></section></div>`;}
function issuesHTML(issues){return issues.length?issues.map(i=>`<div class="issue"><div><b>${esc(i.code)}</b><p>${esc(i.message)}${i.path?` · ${esc(i.path)}`:''}</p></div><span class="sev ${i.severity}">${i.severity.toUpperCase()}</span></div>`).join(''):'<div class="callout">No validation issues.</div>';}

function bindGlobal(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.activeMode=b.dataset.nav;render();});$('#sideScenario')?.addEventListener('change',e=>{state.activeScenarioId=e.target.value;recalculate();render();});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b));document.querySelectorAll('[data-chart-full]').forEach(b=>b.onclick=()=>toggleChartFull(b.dataset.chartFull));}
function bindPage(){document.querySelectorAll('[data-plan-range]').forEach(el=>el.oninput=()=>planInput(el.dataset.planRange,Number(el.value),el.dataset.format));document.querySelectorAll('[data-plan-number]').forEach(el=>el.onchange=()=>planInput(el.dataset.planNumber,Number(el.value),el.dataset.format));document.querySelectorAll('[data-plan-select]').forEach(el=>el.onchange=()=>{setPath(state.plan,el.dataset.planSelect,el.value);markDirty();});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>editEntity(b.dataset.add,null));document.querySelectorAll('[data-edit-kind]').forEach(b=>b.onclick=()=>editEntity(b.dataset.editKind,b.dataset.editId));document.querySelectorAll('[data-scenario]').forEach(b=>b.onclick=()=>{state.activeScenarioId=b.dataset.scenario;recalculate();render();});document.querySelectorAll('[data-scen-clone]').forEach(b=>b.onclick=()=>cloneScenario(b.dataset.scenClone));document.querySelectorAll('[data-scen-edit]').forEach(b=>b.onclick=()=>editScenario(b.dataset.scenEdit));document.querySelectorAll('[data-scen-del]').forEach(b=>b.onclick=()=>deleteScenario(b.dataset.scenDel));document.querySelectorAll('[data-decision-tab]').forEach(b=>b.onclick=()=>{state.decisionTab=b.dataset.decisionTab;render();});document.querySelectorAll('[data-decision-range]').forEach(e=>e.oninput=()=>{state.rentBuyDraft[e.dataset.decisionRange]=Number(e.value);render();});document.querySelectorAll('[data-decision-number]').forEach(e=>e.onchange=()=>{state.rentBuyDraft[e.dataset.decisionNumber]=Number(e.value);render();});document.querySelectorAll('[data-lab-tab]').forEach(b=>b.onclick=()=>{state.labTab=b.dataset.labTab;render();});document.querySelectorAll('[data-disclosure]').forEach(b=>b.onclick=()=>{state.disclosure=b.dataset.disclosure;render();});document.querySelectorAll('[data-opt-apply]').forEach(b=>b.onclick=()=>applyOptimization(b.dataset.optApply,Number(b.dataset.optValue)));document.querySelectorAll('[data-risk]').forEach(e=>e.oninput=()=>{state.plan.riskSettings=state.plan.riskSettings||{};state.plan.riskSettings[e.dataset.risk]=Number(e.value);markDirty();});document.querySelectorAll('[data-risk-number]').forEach(e=>e.onchange=()=>{state.plan.riskSettings=state.plan.riskSettings||{};state.plan.riskSettings[e.dataset.riskNumber]=Number(e.value);markDirty();});$('#taxPackSelect')?.addEventListener('change',e=>{state.plan.settings.taxPackId=e.target.value;markDirty();});updateFingerprint();}
function planInput(path,v,format){if(path==='meta.horizonMonths')v=Math.round(v/12)*12;setPath(state.plan,path,v);if(path==='settings.minimumCashMonths'){for(const q of state.plan.policies||[])if(q.type==='reserve'||q.type==='invest_surplus')q.minimumCashMonths=v;}state.rentBuyDraft=rentBuyFromPlan();markDirty();}

async function action(a,b){if(a==='theme'){state.theme=state.theme==='dark'?'light':'dark';try{localStorage.setItem('fds_theme',state.theme);}catch(e){}document.documentElement.dataset.theme=state.theme;render();}else if(a==='undo')undoPlan();else if(a==='redo')redoPlan();else if(a==='dismissFirst'){state.firstRun=false;render();}else if(a==='quickDecision'){state.firstRun=false;state.activeMode='decisions';state.decisionTab='rentbuy';render();}else if(a==='buildPlan'){buildPlanWizard();}else if(a==='newblank')confirmBlank();else if(a==='resetExample'){state.plan=C.defaultPlan();state.activeScenarioId='baseline';state.rentBuyDraft=rentBuyFromPlan();state.firstRun=false;markDirty();}else if(a==='checkpoint'){const m=await savePlan();toast(m==='memory'?'Session-only: export a Portable HTML or Plan JSON for durable backup.':'Checkpoint saved.');}else if(a==='menu')showDataMenu();else if(a==='export')exportJSON();else if(a==='share')shareMenu();else if(a==='editHousing')editHousing();else if(a==='editCorrelation')editCorrelation();else if(a==='snapshot')recordSnapshot();else if(a==='rebaseSnapshot')confirmRebase(b?.dataset.snapshotId);else if(a==='newScenario')newScenario();else if(a==='createRentBuyScenarios')createRentBuyScenarios();else if(a==='openRentBuyLab'){state.activeMode='lab';state.labTab='sensitivity';render();}else if(a==='retirementScenario')createRetirementScenario();else if(a==='addPurchaseEvent')editPurchaseEvent();else if(a==='runRisk')runRisk();else if(a==='cancelRisk')cancelRisk();else if(a==='exportLedger')exportLedgerCSV();else if(a==='editJSON')expertJSON();}function undoPlan(){if(!state.undo.length)return;clearTimeout(state.historyTimer);state.historyPending=false;state.redo.push(JSON.stringify(state.plan));state.plan=JSON.parse(state.undo.pop());state.historyBase=JSON.stringify(state.plan);state.activeScenarioId=(state.plan.scenarios||[]).some(x=>x.id===state.activeScenarioId)?state.activeScenarioId:state.plan.baselineScenarioId;state.rentBuyDraft=rentBuyFromPlan();state.dirty=true;recalculate();render();saveSoon();toast('Undone.');}
function redoPlan(){if(!state.redo.length)return;clearTimeout(state.historyTimer);state.historyPending=false;state.undo.push(JSON.stringify(state.plan));state.plan=JSON.parse(state.redo.pop());state.historyBase=JSON.stringify(state.plan);state.activeScenarioId=(state.plan.scenarios||[]).some(x=>x.id===state.activeScenarioId)?state.activeScenarioId:state.plan.baselineScenarioId;state.rentBuyDraft=rentBuyFromPlan();state.dirty=true;recalculate();render();saveSoon();toast('Redone.');}
function confirmRebase(id){const snap=(state.plan.actualSnapshots||[]).find(x=>x.id===id)||(state.plan.actualSnapshots||[]).at(-1);if(!snap||snap.cash==null){toast('A component-level snapshot is required to rebase.');return;}showModal('Rebase future plan',`<div class="callout"><b>${esc(snap.ym)}</b> will become the new projection start. Cash, investments, property and debt will be replaced by the observed snapshot. Historical snapshots remain archived, while future month references are shifted so calendar goals keep their intended dates where possible.</div>`,`<button class="btn" data-modal-close>Cancel</button><button class="btn danger" id="rebaseGo">Rebase plan</button>`);$('#rebaseGo').onclick=()=>{try{state.plan=C.rebasePlanFromSnapshot(state.plan,snap);state.activeScenarioId=state.plan.baselineScenarioId;state.rentBuyDraft=rentBuyFromPlan();closeModal();markDirty();toast('Plan rebased from actual snapshot.');}catch(e){toast(`Rebase failed: ${e.message}`);}};}
function confirmBlank(){showModal('Start a blank plan',`<div class="callout">This replaces the current in-memory plan. Export first if you want to keep it.</div>`,`<button class="btn" data-modal-close>Cancel</button><button class="btn danger" id="blankConfirm">Replace plan</button>`);$('#blankConfirm').onclick=()=>{const p=C.defaultPlan();p.meta.name='New Plan';p.accounts[0].openingCashBalance=0;p.holdings.forEach(h=>{h.openingMarketValue=0;h.costBasis=0;});p.incomeStreams[0].amount=0;p.expenseStreams[0].amount=0;p.housing.strategy='none';p.goals=[];state.plan=p;state.activeScenarioId='baseline';state.rentBuyDraft=rentBuyFromPlan();state.firstRun=false;closeModal();markDirty();};}

function editEntity(kind,id){if(kind==='income')return editStream('income',id);if(kind==='expense')return editStream('expense',id);if(kind==='asset')return editAsset(id);if(kind==='goal')return editGoal(id);if(kind==='liability')return editLiability(id);if(kind==='property')return editProperty(id);if(kind==='event')return editEvent(id);if(kind==='insurance')return editInsurance(id);if(kind==='person')return editPerson(id);if(kind==='policy')return editPolicy(id);}function editStream(kind,id){const arr=kind==='income'?state.plan.incomeStreams:state.plan.expenseStreams,e=id?arr.find(x=>x.id===id):{id:C.uid(kind),name:kind==='income'?'New income':'New expense',amount:1000,frequency:'monthly',startMonth:0,endMonth:null,growthRate:state.plan.assumptions.inflation||.02,...(kind==='income'?{taxMode:'net'}:{priority:'essential'})};const body=`<div class="form-grid"><div class="field"><label>Name</label><input class="input" id="fName" value="${esc(e.name)}"></div><div class="field"><label>Monthly / periodic amount</label><input class="input" type="number" id="fAmount" value="${e.amount}"></div><div class="field"><label>Frequency</label><select class="select" id="fFreq">${['monthly','quarterly','annual','one_time'].map(x=>`<option ${e.frequency===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Annual growth</label><input class="input" type="number" step="0.001" id="fGrowth" value="${e.growthRate||0}"></div><div class="field"><label>Start month</label><input class="input" type="number" id="fStart" value="${e.startMonth||0}"></div><div class="field"><label>End month (blank = horizon)</label><input class="input" type="number" id="fEnd" value="${e.endMonth??''}"></div>${kind==='income'?`<div class="field"><label>Tax mode</label><select class="select" id="fExtra"><option value="net" ${e.taxMode==='net'?'selected':''}>Net amount</option><option value="gross" ${e.taxMode==='gross'?'selected':''}>Gross — apply tax pack</option></select></div>`:`<div class="field"><label>Priority</label><select class="select" id="fExtra"><option value="essential" ${e.priority==='essential'?'selected':''}>Essential</option><option value="discretionary" ${e.priority==='discretionary'?'selected':''}>Discretionary</option></select></div>`}</div>`;showModal(`${id?'Edit':'Add'} ${kind}`,body,`<button class="btn" data-modal-close>Cancel</button>${id?'<button class="btn danger" id="fDelete">Delete</button>':''}<button class="btn primary" id="fSave">Save</button>`);$('#fSave').onclick=()=>{e.name=$('#fName').value.trim()||e.name;e.amount=Math.max(0,Number($('#fAmount').value)||0);e.frequency=$('#fFreq').value;e.growthRate=Number($('#fGrowth').value)||0;e.startMonth=Math.max(0,Math.round(Number($('#fStart').value)||0));e.endMonth=$('#fEnd').value===''?null:Math.max(e.startMonth,Math.round(Number($('#fEnd').value)));if(kind==='income')e.taxMode=$('#fExtra').value;else e.priority=$('#fExtra').value;if(!id)arr.push(e);closeModal();markDirty();};if(id)$('#fDelete').onclick=()=>{const i=arr.findIndex(x=>x.id===id);if(i>=0)arr.splice(i,1);closeModal();markDirty();};}
function buildPlanWizard(){
 const base=C.defaultPlan(),draft={name:'My Financial Plan',adults:1,birthYear:new Date().getFullYear()-35,retirementYear:new Date().getFullYear()+30,cash:20000,investments:30000,housing:'rent',property:250000,mortgage:180000,income:3200,expenses:1600,rent:850,goal:750000,goalYears:30,goalPriority:'target',horizonYears:30,inflation:.02,equityReturn:.07};let step=0;
 const steps=[
  {title:'1 · Household',sub:'Who and what plan are we modeling?',html:()=>`<div class="form-grid"><div class="field"><label>Plan name</label><input class="input" id="wName" value="${esc(draft.name)}"></div><div class="field"><label>Adults</label><select class="select" id="wAdults"><option value="1" ${draft.adults===1?'selected':''}>1 adult</option><option value="2" ${draft.adults===2?'selected':''}>2 adults</option></select></div><div class="field"><label>Your birth year</label><input class="input" type="number" id="wBirth" min="1900" max="2100" value="${draft.birthYear}"></div><div class="field"><label>Illustrative retirement year</label><input class="input" type="number" id="wRet" min="${new Date().getFullYear()}" max="2150" value="${draft.retirementYear}"></div></div>`},
  {title:'2 · Current position',sub:'Start from the balance sheet you have today.',html:()=>`<div class="form-grid"><div class="field"><label>Cash</label><input class="input" type="number" min="0" id="wCash" value="${draft.cash}"></div><div class="field"><label>Investments</label><input class="input" type="number" min="0" id="wInv" value="${draft.investments}"></div><div class="field"><label>Housing</label><select class="select" id="wHousing"><option value="rent" ${draft.housing==='rent'?'selected':''}>Rent</option><option value="buy" ${draft.housing==='buy'?'selected':''}>Own a home</option><option value="none" ${draft.housing==='none'?'selected':''}>No housing cost modeled</option></select></div><div class="field"><label>Current home value (if owned)</label><input class="input" type="number" min="0" id="wProp" value="${draft.property}"></div><div class="field"><label>Mortgage balance (if owned)</label><input class="input" type="number" min="0" id="wMort" value="${draft.mortgage}"></div></div>`},
  {title:'3 · Monthly cash flow',sub:'Use net household cash flow for a fast, understandable first plan.',html:()=>`<div class="form-grid"><div class="field"><label>Net household income / month</label><input class="input" type="number" min="0" id="wIncome" value="${draft.income}"></div><div class="field"><label>Essential living costs / month</label><input class="input" type="number" min="0" id="wExpenses" value="${draft.expenses}"></div><div class="field"><label>Rent / month (if renting)</label><input class="input" type="number" min="0" id="wRent" value="${draft.rent}"></div></div><div class="help">You can add separate salaries, discretionary expenses, debts, properties and policies later in Detailed mode.</div>`},
  {title:'4 · Main goal',sub:'Choose one primary target. More goals can be added later.',html:()=>`<div class="form-grid"><div class="field"><label>Target net worth</label><input class="input" type="number" min="0" id="wGoal" value="${draft.goal}"></div><div class="field"><label>Years to target</label><input class="input" type="number" min="1" max="100" id="wGoalYears" value="${draft.goalYears}"></div><div class="field"><label>Goal importance</label><select class="select" id="wGoalPriority"><option value="target" ${draft.goalPriority==='target'?'selected':''}>Target</option><option value="hard" ${draft.goalPriority==='hard'?'selected':''}>Hard constraint</option><option value="aspirational" ${draft.goalPriority==='aspirational'?'selected':''}>Aspirational</option></select></div></div>`},
  {title:'5 · Assumptions review',sub:'These are planning assumptions, not forecasts. You can change them at any time.',html:()=>`<div class="form-grid"><div class="field"><label>Analysis horizon (years)</label><input class="input" type="number" min="5" max="100" id="wHorizon" value="${draft.horizonYears}"></div><div class="field"><label>Inflation assumption</label><input class="input" type="number" step="0.001" min="-0.2" max="0.3" id="wInflation" value="${draft.inflation}"></div><div class="field"><label>Global-equity expected return</label><input class="input" type="number" step="0.001" min="-0.5" max="0.5" id="wEqRet" value="${draft.equityReturn}"></div></div><div class="callout" style="margin-top:10px">The generated plan uses a generic no-automatic-tax pack and the standard diversified example allocation. Tax, correlation, portfolio and stochastic assumptions remain editable in Lab.</div>`}

function renderHeatmap(){const el=$('#heatmap'),{xVals,yVals,grid}=state._sens,max=Math.max(...grid.flat().map(Math.abs),1);el.style.gridTemplateColumns=`80px repeat(${xVals.length},1fr)`;let h='<div></div>'+xVals.map(x=>`<div class="heat-label">${fmtPct(x,2)}</div>`).join('');for(let r=0;r<yVals.length;r++){h+=`<div class="heat-label">${fmtMoney(yVals[r])}/mo</div>`;for(let c=0;c<xVals.length;c++){const v=grid[r][c],a=.08+.32*Math.min(1,Math.abs(v)/max),color=v>=0?`color-mix(in srgb,var(--good) ${a*100}%,var(--surface))`:`color-mix(in srgb,var(--blue) ${a*100}%,var(--surface))`;h+=`<div class="heat-cell" style="background:${color}" data-hx="${xVals[c]}" data-hy="${yVals[r]}">${v>=0?'+':''}${short(v)} €</div>`;}}el.innerHTML=h;$$('[data-hx]',el).forEach(c=>c.onclick=()=>{state.rentBuyDraft.mortRate=Number(c.dataset.hx);state.rentBuyDraft.directRent=Number(c.dataset.hy);state.activeMode='decisions';state.decisionTab='rentbuy';render();toast('Sensitivity point applied to the decision template.');});}

function barChart(el,x,vals){el.innerHTML='<canvas></canvas>';const c=$('canvas',el),ctx=c.getContext('2d');function draw(){const r=el.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);const W=r.width,H=r.height,p={l:40,r:12,t:20,b:28},mx=Math.max(...vals,1),bw=(W-p.l-p.r)/vals.length;ctx.clearRect(0,0,W,H);ctx.fillStyle=css('--blue');for(let i=0;i<vals.length;i++){const h=(H-p.t-p.b)*vals[i]/mx;ctx.fillRect(p.l+i*bw+1,H-p.b-h,Math.max(1,bw-2),h);}ctx.fillStyle=css('--muted');ctx.font='9px sans-serif';ctx.textAlign='center';for(let j=0;j<=4;j++){const i=Math.min(vals.length-1,Math.round((vals.length-1)*j/4));ctx.fillText(short(x[i]),p.l+i*bw,H-9);}}const ro=new ResizeObserver(draw);ro.observe(el);draw();return{destroy:()=>ro.disconnect()};}
function renderFanChart(){const rr=state.riskResult,s=rr.summaries.find(x=>x.scenarioId===state.activeScenarioId)||rr.summaries[0],fan=s.summary.fan,x=fan.map(z=>z.year);charts.push(fanCanvas($('#fanChart'),fan));}
function fanCanvas(el,fan){el.innerHTML='<canvas></canvas>';const c=$('canvas',el),ctx=c.getContext('2d');function draw(){const r=el.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);const W=r.width,H=r.height,p={l:65,r:15,t:22,b:30},vals=fan.flatMap(x=>[x.p5,x.p95]),mn=Math.min(0,...vals),mx=Math.max(...vals,1),xx=i=>p.l+i/(Math.max(1,fan.length-1))*(W-p.l-p.r),yy=v=>p.t+(H-p.t-p.b)*(1-(v-mn)/(mx-mn));ctx.clearRect(0,0,W,H);ctx.fillStyle='rgba(47,120,196,.10)';ctx.beginPath();fan.forEach((f,i)=>i?ctx.lineTo(xx(i),yy(f.p95)):ctx.moveTo(xx(i),yy(f.p95)));for(let i=fan.length-1;i>=0;i--)ctx.lineTo(xx(i),yy(fan[i].p5));ctx.closePath();ctx.fill();ctx.fillStyle='rgba(47,120,196,.16)';ctx.beginPath();fan.forEach((f,i)=>i?ctx.lineTo(xx(i),yy(f.p75)):ctx.moveTo(xx(i),yy(f.p75)));for(let i=fan.length-1;i>=0;i--)ctx.lineTo(xx(i),yy(fan[i].p25));ctx.closePath();ctx.fill();ctx.strokeStyle=css('--blue');ctx.lineWidth=2.2;ctx.beginPath();fan.forEach((f,i)=>i?ctx.lineTo(xx(i),yy(f.p50)):ctx.moveTo(xx(i),yy(f.p50)));ctx.stroke();ctx.strokeStyle=css('--line');ctx.fillStyle=css('--muted');ctx.font='9px sans-serif';for(let j=0;j<=5;j++){const v=mn+(mx-mn)*j/5,y=yy(v);ctx.beginPath();ctx.moveTo(p.l,y);ctx.lineTo(W-p.r,y);ctx.stroke();ctx.fillText(short(v),5,y+3);}ctx.textAlign='center';for(let j=0;j<=5;j++){const i=Math.min(fan.length-1,Math.round((fan.length-1)*j/5));ctx.fillText(`Y${fan[i].year}`,xx(i),H-8);}}const ro=new ResizeObserver(draw);ro.observe(el);draw();return{destroy:()=>ro.disconnect()};}
